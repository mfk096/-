<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Инвентаризация</title>
    <script>
      // GitHub Pages отдаёт этот файл, не меняя адрес в строке.
      // Перенаправляем на index.html с путём в query, а index.html возвращает адрес обратно.
      // pathSegmentsToKeep = 1: сайт открыт как https://mfk096.github.io/-/
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
