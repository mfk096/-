name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Пакет tools из SDK удалён. У action по умолчанию стоит «tools platform-tools»,
      # из-за этого sdkmanager падает с «Failed to find package tools».
      # compileSdk проекта — 36, Gradle дополнительно берёт build-tools 35.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 build-tools;36.0.0'

      - name: Зависимости
        working-directory: frontend
        run: npm ci

      # Адрес тестового Supabase и anon key — repository variables.
      # База веб-сборки для APK остаётся «/»: оболочка открывает файлы с localhost.
      - name: Сборка веба
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Переменные Supabase не заданы. В APK адрес тестового проекта уже подставлен, anon key нужно будет ввести в настройках подключения."
          fi
          npm run build

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      - name: Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Загрузить debug APK
        uses: actions/upload-artifact@v4
        with:
          name: inventory-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
            echo "Секреты подписи не заданы, release APK пропущен."
            exit 0
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          export ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
          ./gradlew assembleRelease --no-daemon

      - name: Загрузить release APK
        uses: actions/upload-artifact@v4
        with:
          name: inventory-release-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      # С телефона артефакт Actions не скачать без входа. Pre-release latest-apk обновляется
      # с main и при ручном запуске. Тег v1.0.0 создаётся один раз и дальше не перезаписывается.
      - name: Выложить debug APK в GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(find frontend/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "${RUNNER_TEMP}/app-debug.apk"
          NOTES=$'Debug APK 1.0.0 для проверки.\nАдрес тестового Supabase подставлен, если в репозитории заданы переменные VITE_SUPABASE_URL и VITE_SUPABASE_ANON_KEY. Сменить адрес можно в приложении: «Настройки подключения».\nСкачать: https://github.com/mfk096/-/releases/download/latest-apk/app-debug.apk'
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk "${RUNNER_TEMP}/app-debug.apk" --clobber
          else
            gh release create latest-apk "${RUNNER_TEMP}/app-debug.apk" \
              --prerelease \
              --title "Последний debug APK" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 "${RUNNER_TEMP}/app-debug.apk" \
              --title "Инвентаризация 1.0.0" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi
